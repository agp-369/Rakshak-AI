name: rakshak_ai
description: Rakshak - AI-first offline disaster survival companion for India. On-device Gemma turns official warnings and panicked voice into clear action; SMS beacons, family board and first-10-minutes guides keep working when networks die.
version: 2.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^0.15.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  path: ^1.9.1
  shared_preferences: ^2.3.4
  share_plus: ^10.0.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.1.0
  url_launcher: ^6.3.1
  http: ^1.2.0
  vibration: ^2.0.0
  # Transitive dep of flutter_gemma. 9.5.9 fails Kotlin compilation and
  # 9.6.x requires Dart >=3.13; 9.5.8 is the last buildable release here.
  background_downloader: 9.5.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
